<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Día de la Novia ❤️</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;}

body{
  background: linear-gradient(180deg, #ffcad4, #ffe5ec);
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  overflow-x: hidden;
  color: #590d22;
  text-align: center;
}

#intro{
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  background: #1a000c;
  color: #fff;
}

#intro h1{
  font-size: 42px;
  animation: fade 3s infinite alternate;
  padding: 0 20px;
}

button{
  padding: 16px 45px;
  font-size: 22px;
  margin-top: 35px;
  border: none;
  border-radius: 50px;
  background: #ff4d6d;
  color: white;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 0 25px #ff758f;
  transition: transform 0.2s;
}

button:hover{
  transform: scale(1.08);
}

@keyframes fade{
  from{ opacity: 0.3; }
  to{ opacity: 1; }
}

#contenido{
  display: none;
  padding: 40px 20px;
}

.audio-box {
  margin-bottom: 25px;
}

audio {
  border-radius: 30px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.img-container {
  margin: 20px auto;
}

img{
  width: 280px;
  max-width: 85%;
  border-radius: 20px;
  border: 4px solid #fff;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  transition: transform 0.4s;
}

img:hover{
  transform: scale(1.03);
}

#contador{
  font-size: 26px;
  margin: 25px 10px;
  font-weight: bold;
  color: #c9184a;
  line-height: 1.5;
}

#carta{
  max-width: 800px;
  margin: auto;
  font-size: 19px;
  line-height: 1.8;
  background: rgba(255, 255, 255, 0.65);
  color: #590d22; /* Color oscuro para alta legibilidad */
  padding: 35px 25px;
  border-radius: 20px;
  backdrop-filter: blur(10px);
  box-shadow: 0 8px 32px 0 rgba(160, 21, 62, 0.1);
  text-align: left;
  white-space: pre-line;
}

.versiculo {
  font-style: italic;
  font-weight: 600;
  color: #800f2f;
  background: rgba(255, 255, 255, 0.5);
  padding: 10px 15px;
  border-left: 4px solid #ff4d6d;
  border-radius: 6px;
  margin: 10px 0;
}

.corazon{
  position: fixed;
  top: -20px;
  font-size: 24px;
  animation: caer linear forwards;
  pointer-events: none;
}

@keyframes caer{
  to{
    transform: translateY(110vh) rotate(720deg);
    opacity: 0;
  }
}

.final{
  margin-top: 60px;
  font-size: 40px;
  font-weight: bold;
  color: #a4133c;
  animation: fade 2s infinite alternate;
}
</style>

</head>

<body>

<div id="intro">
  <h1>Para la mujer que cambió mi vida ❤️</h1>
  <h2 style="margin-top:15px; color:#ffb3c1; font-weight:normal;">Feliz Día de la Novia</h2>
  <button onclick="iniciar()">Presiona aquí ❤️</button>
</div>

<div id="contenido">

  <div class="audio-box">
    <audio id="audio" controls autoplay loop>
      <source src="audio.mp3" type="audio/mpeg">
      Tu navegador no soporta el reproductor de audio.
    </audio>
  </div>

  <div class="img-container">
    <img src="foto.jpg" alt="Foto Juntos">
  </div>

  <h2 style="margin-top:20px; color:#a4133c;">Desde el 21 de diciembre del 2023</h2>

  <div id="contador"></div>

  <div id="carta"></div>

  <div class="final">
    ALETH ❤️ EFRAÍN
  </div>

</div>

<script>

function iniciar(){
  document.getElementById("intro").style.display="none";
  document.getElementById("contenido").style.display="block";
  
  const audio = document.getElementById("audio");
  audio.play().catch(e => console.log("El reproductor esperó acción del usuario."));

  escribirCarta();
}

const carta = `✨ Mi amor, mi cielo y mi princesa 👑❤️

Hoy, 1 de agosto, en el Día de la Novia, celebro la bendición más grande que Dios puso en mi camino: tú. 🌹🙏

Aún recuerdo con una sonrisa aquellos últimos meses de 2023 cuando nuestras vidas se cruzaron. Sin saber todo lo maravilloso que Dios tenía preparado, empezamos a construir, paso a paso, algo verdaderamente hermoso. ✨ Fue el 21 de diciembre de 2023 cuando tomamos la decisión de unir nuestros caminos como enamorados, e iniciar esta historia que hoy sigue floreciendo con más fuerza que nunca. 💖🌱

«El amor es paciente, es bondadoso... Todo lo sufre, todo lo cree, todo lo espera, todo lo soporta. El amor nunca deja de ser.» — 1 Corintios 13:4, 7-8 📖🕊️

A lo largo de este tiempo, no solo hemos cultivado un amor profundo, sino que hemos aprendido el verdadero significado de caminar juntos. Hemos disfrutado de momentos llenos de alegría y también hemos superado altibajos y días difíciles; pero en cada proceso nos hemos vuelto a elegir con más convicción. Comprendimos que esto no se trataba solo de ser novios, sino de soñar y construir un futuro eterno. 🏛️💍

Lo más hermoso de todo es saber que este futuro no lo caminamos solos. Ambos hemos tomado la decisión más valiosa: dejar que Cristo sea el centro, el guía y el cimiento de nuestra relación. ✝️ Sé lo mucho que nos hemos esforzado para dar este paso de fe, confiando en que sea Él quien fortalezca cada escalón que subimos juntos. 🪜✨

«Cordón de tres dobleces no se rompe pronto.» — Eclesiastés 4:12 🎗️

Nuestra promesa es seguir caminando firmes de la mano de Dios, con el compromiso mutuo de llegar juntos al matrimonio, perseverando en Su amor y amándonos incondicionalmente en las buenas y en las malas. 🤍👰🤵

Hoy solo quiero darte las gracias desde lo más profundo de mi corazón. 💖 Gracias por formar parte de mi vida, por estar siempre a mi lado celebrando cada uno de mis logros, apoyándome en mis objetivos y escuchando con tanto amor cada sueño que te comparto. De la misma manera, ten por seguro que siempre estaré aquí para sostenerte, cuidarte y caminar a tu lado en cada meta que te propongas. 🤝🏡

«Doy gracias a mi Dios cada vez que me acuerdo de ti.» — Filipenses 1:3 🙌✨

Eres lo mejor que me ha pasado en la vida. Para mí siempre serás mi beba, mi hermosa, mi vida, mi cielo, mi princesa, mi reina y mi amorcito. 👸💖👑

Te amo con todo mi corazón y le doy infinitas gracias a Dios por tu vida. ✝️❤️

Con todo mi amor,
Siempre tuyo, Efraín 👨‍❤️‍💋‍👩`;

let i = 0;
function escribirCarta(){
  if(i < carta.length){
    document.getElementById("carta").innerHTML += carta.charAt(i);
    i++;
    setTimeout(escribirCarta, 30);
  }
}

const inicio = new Date("2023-12-21T00:00:00");

setInterval(() => {
  const ahora = new Date();
  const d = ahora - inicio;

  const dias = Math.floor(d / (1000 * 60 * 60 * 24));
  const horas = Math.floor((d / (1000 * 60 * 60)) % 24);
  const minutos = Math.floor((d / (1000 * 60)) % 60);
  const segundos = Math.floor((d / (1000)) % 60);

  document.getElementById("contador").innerHTML =
    dias + " días ❤️ " + horas + " horas ❤️ " + minutos + " minutos ❤️ " + segundos + " segundos";
}, 1000);

setInterval(() => {
  const c = document.createElement("div");
  c.className = "corazon";
  c.innerHTML = "❤️";
  c.style.left = Math.random() * 100 + "vw";
  c.style.animationDuration = (4 + Math.random() * 4) + "s";
  document.body.appendChild(c);

  setTimeout(() => {
    c.remove();
  }, 8000);
}, 300);

</script>

</body>
</html>
